[project]
name = "drone-simulation"
version = "0.1.0"
description = "Drone flight safety simulation system"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.21.0",
    "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
# General settings like 'exclude' still go here
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]
line-length = 88

# Linting specific settings should now be under [tool.ruff.lint]
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long
]